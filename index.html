<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Priority Planner</title>
    <style>
      :root {
        --bg: #f5f2eb;
        --surface: #ffffff;
        --surface-soft: #f7f6f2;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e7e3db;
        --accent: #5b5bd6;
        --accent-soft: #efecff;
        --success: #2f9e44;
        --danger: #e03131;
        --shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #f8f5ee 0%, var(--bg) 100%);
      }

      .app-shell {
        width: min(100%, 1100px);
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 28px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .title-group h1 {
        margin: 0;
        font-size: clamp(1.4rem, 2.2vw, 1.9rem);
        font-weight: 700;
      }

      .title-group p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid #d9d5ff;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .task-form {
        display: grid;
        grid-template-columns: 1.4fr 1.1fr 0.7fr auto;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface-soft);
        margin-bottom: 16px;
      }

      .task-form input,
      .task-form textarea,
      .task-form select,
      .title-input,
      .description-input,
      .priority-select {
        width: 100%;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 11px 12px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
      }

      .task-form textarea,
      .description-input {
        resize: vertical;
        min-height: 44px;
      }

      .task-form input:focus,
      .task-form textarea:focus,
      .task-form select:focus,
      .title-input:focus,
      .description-input:focus,
      .priority-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.14);
      }

      button {
        border: none;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--accent);
        color: white;
        padding: 11px 15px;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: 0 8px 18px rgba(91, 91, 214, 0.18);
      }

      .table-card {
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: var(--surface);
      }

      .table-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        background: #fcfbf8;
      }

      .table-top h2 {
        margin: 0;
        font-size: 1rem;
      }

      .table-top p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .task-table {
        width: 100%;
        border-collapse: collapse;
      }

      .task-table th,
      .task-table td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      .task-table th {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: #fcfbf8;
      }

      .task-row.completed {
        background: #f8fcf8;
      }

      .task-row.completed .title-input {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-title-cell {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .checkbox {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        accent-color: var(--success);
        cursor: pointer;
      }

      .title-input {
        border: 0;
        padding: 0;
        background: transparent;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: none;
      }

      .description-input {
        border: 0;
        padding: 0;
        background: transparent;
        min-height: 40px;
        color: var(--muted);
        line-height: 1.45;
        box-shadow: none;
      }

      .priority-select {
        border: 0;
        padding: 0;
        background: transparent;
        font-size: 0.9rem;
        box-shadow: none;
      }

      .delete-btn {
        background: transparent;
        color: var(--danger);
        padding: 6px 8px;
        border-radius: 8px;
      }

      .delete-btn:hover {
        background: #fff1f2;
      }

      .empty-state {
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        body {
          padding: 12px;
        }

        .app-shell {
          padding: 18px;
        }

        .header {
          flex-direction: column;
        }

        .task-form {
          grid-template-columns: 1fr;
        }

        .task-table th:nth-child(3),
        .task-table td:nth-child(3) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="header">
        <div class="title-group">
          <p class="eyebrow">Focus & Flow</p>
          <h1>Priority Planner</h1>
          <p>Capture tasks, organize by priority, and keep momentum moving.</p>
        </div>
        <div class="pill" id="taskCount">0 tasks</div>
      </header>

      <form class="task-form" id="taskForm">
        <input id="taskTitle" name="taskTitle" type="text" placeholder="Task title" required />
        <textarea id="taskDescription" name="taskDescription" placeholder="Add details"></textarea>
        <select id="taskPriority" name="taskPriority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
        <button class="primary-btn" type="submit">Add task</button>
      </form>

      <section class="table-card" aria-label="Task list">
        <div class="table-top">
          <div>
            <h2>Today's priorities</h2>
            <p>Keep your top work visible and complete tasks in sequence.</p>
          </div>
          <div class="badge" id="completionBadge">0% complete</div>
        </div>
        <table class="task-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Task</th>
              <th>Priority</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "priority-planner-tasks";
      const form = document.getElementById("taskForm");
      const titleInput = document.getElementById("taskTitle");
      const descriptionInput = document.getElementById("taskDescription");
      const priorityInput = document.getElementById("taskPriority");
      const taskTableBody = document.getElementById("taskTableBody");
      const taskCount = document.getElementById("taskCount");
      const completionBadge = document.getElementById("completionBadge");

      let tasks = loadTasks();

      function loadTasks() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function renderTasks() {
        taskTableBody.innerHTML = "";

        if (tasks.length === 0) {
          taskTableBody.innerHTML = `
            <tr>
              <td colspan="4" class="empty-state">No tasks yet. Add your first priority above.</td>
            </tr>
          `;
        } else {
          tasks.forEach((task) => {
            const row = document.createElement("tr");
            row.className = `task-row${task.completed ? " completed" : ""}`;
            row.innerHTML = `
              <td>
                <div class="task-title-cell">
                  <input class="checkbox" type="checkbox" ${task.completed ? "checked" : ""} data-id="${task.id}" />
                </div>
              </td>
              <td>
                <div class="task-title-cell">
                  <div>
                    <input class="title-input" value="${escapeHtml(task.title)}" data-id="${task.id}" data-field="title" />
                    <textarea class="description-input" data-id="${task.id}" data-field="description">${escapeHtml(task.description || "")}</textarea>
                  </div>
                </div>
              </td>
              <td>
                <select class="priority-select" data-id="${task.id}" data-field="priority">
                  <option value="High" ${task.priority === "High" ? "selected" : ""}>High</option>
                  <option value="Medium" ${task.priority === "Medium" ? "selected" : ""}>Medium</option>
                  <option value="Low" ${task.priority === "Low" ? "selected" : ""}>Low</option>
                </select>
              </td>
              <td>
                <button class="delete-btn" type="button" data-id="${task.id}">Remove</button>
              </td>
            `;
            taskTableBody.appendChild(row);
          });
        }

        updateSummary();
      }

      function updateSummary() {
        const completed = tasks.filter((task) => task.completed).length;
        const total = tasks.length;
        taskCount.textContent = `${total} ${total === 1 ? "task" : "tasks"}`;
        completionBadge.textContent = total === 0 ? "0% complete" : `${Math.round((completed / total) * 100)}% complete`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        const description = descriptionInput.value.trim();
        const priority = priorityInput.value;

        if (!title) return;

        tasks.unshift({
          id: crypto.randomUUID(),
          title,
          description,
          priority,
          completed: false,
        });

        saveTasks();
        renderTasks();
        form.reset();
        priorityInput.value = "Medium";
        titleInput.focus();
      });

      taskTableBody.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const id = target.dataset.id;
        const field = target.dataset.field;

        if (!id || !field) return;

        tasks = tasks.map((task) => (task.id === id ? { ...task, [field]: field === "completed" ? target.checked : target.value } : task));
        saveTasks();
        renderTasks();
      });

      taskTableBody.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        if (target.classList.contains("delete-btn")) {
          const id = target.dataset.id;
          tasks = tasks.filter((task) => task.id !== id);
          saveTasks();
          renderTasks();
        }
      });

      renderTasks();
    </script>
  </body>
</html>
