<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Priority Planner</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f2eb;
        --surface: #ffffff;
        --surface-soft: #f7f6f2;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e7e3db;
        --accent: #5b5bd6;
        --accent-soft: #efecff;
        --success: #2f9e44;
        --danger: #e03131;
        --shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        --input-bg: #ffffff;
        --table-head-bg: #fcfbf8;
        --row-completed-bg: #f8fcf8;
        --toggle-bg: #f3efe8;
        --toggle-hover-bg: #e7dfd0;
        --toggle-color: #6b4c1e;
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #111827;
        --surface: #1f2937;
        --surface-soft: #273244;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --border: #374151;
        --accent: #9ca3ff;
        --accent-soft: rgba(156, 163, 255, 0.2);
        --success: #4ade80;
        --danger: #f87171;
        --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
        --input-bg: #273244;
        --table-head-bg: #273244;
        --row-completed-bg: #18212a;
        --toggle-bg: #273244;
        --toggle-hover-bg: #374151;
        --toggle-color: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #f8f5ee 0%, var(--bg) 100%);
      }

      [data-theme="dark"] body {
        background: linear-gradient(135deg, #0f172a 0%, var(--bg) 100%);
      }

      .app-shell {
        width: min(100%, 1100px);
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 28px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .title-group h1 {
        margin: 0;
        font-size: clamp(1.4rem, 2.2vw, 1.9rem);
        font-weight: 700;
      }

      .title-group p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid #d9d5ff;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .theme-toggle {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--toggle-bg);
        color: var(--toggle-color);
        border: 1px solid var(--border);
        font-size: 1rem;
      }

      .theme-toggle:hover {
        background: var(--toggle-hover-bg);
      }

      .task-form {
        display: grid;
        grid-template-columns: 1.4fr 1.1fr 0.7fr auto;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface-soft);
        margin-bottom: 16px;
      }

      .task-form input,
      .task-form textarea,
      .task-form select,
      .title-input,
      .description-input,
      .priority-select {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        padding: 11px 12px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
      }

      .task-form textarea,
      .description-input {
        resize: vertical;
        min-height: 44px;
      }

      .task-form input:focus,
      .task-form textarea:focus,
      .task-form select:focus,
      .title-input:focus,
      .description-input:focus,
      .priority-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.14);
      }

      button {
        border: none;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--accent);
        color: white;
        padding: 11px 15px;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: 0 8px 18px rgba(91, 91, 214, 0.18);
      }

      .table-card {
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: var(--surface);
      }

      .table-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--table-head-bg);
      }

      .table-top h2 {
        margin: 0;
        font-size: 1rem;
      }

      .table-top p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .task-table {
        width: 100%;
        border-collapse: collapse;
      }

      .task-table th,
      .task-table td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      .task-table th {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--table-head-bg);
      }

      .task-row.completed {
        background: var(--row-completed-bg);
      }

      .task-row.completed .title-input {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-title-cell {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .checkbox {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        accent-color: var(--success);
        cursor: pointer;
      }

      .title-input {
        border: 0;
        padding: 0;
        background: transparent;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: none;
      }

      .description-input {
        border: 0;
        padding: 0;
        background: transparent;
        min-height: 40px;
        color: var(--muted);
        line-height: 1.45;
        box-shadow: none;
      }

      .priority-select {
        border: 0;
        padding: 0;
        background: transparent;
        font-size: 0.9rem;
        box-shadow: none;
      }

      .delete-btn {
        background: transparent;
        color: var(--danger);
        padding: 6px 8px;
        border-radius: 8px;
      }

      .delete-btn:hover {
        background: #fff1f2;
      }

      .empty-state {
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        body {
          padding: 12px;
        }

        .app-shell {
          padding: 18px;
        }

        .header {
          flex-direction: column;
        }

        .task-form {
          grid-template-columns: 1fr;
        }

        .task-table th:nth-child(3),
        .task-table td:nth-child(3) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="header">
        <div class="title-group">
          <p class="eyebrow">Focus & Flow</p>
          <h1>Priority Planner</h1>
          <p>Capture tasks, organize by priority, and keep momentum moving.</p>
        </div>
        <div class="header-actions">
          <div class="pill" id="taskCount">0 tasks</div>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
            <span class="theme-icon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </header>

      <form class="task-form" id="taskForm">
        <input id="taskTitle" name="taskTitle" type="text" placeholder="Task title" required />
        <textarea id="taskDescription" name="taskDescription" placeholder="Add details"></textarea>
        <select id="taskPriority" name="taskPriority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
        <button class="primary-btn" type="submit">Add task</button>
      </form>

      <section class="table-card" aria-label="Task list">
        <div class="table-top">
          <div>
            <h2>Today's priorities</h2>
            <p>Keep your top work visible and complete tasks in sequence.</p>
          </div>
          <div class="badge" id="completionBadge">0% complete</div>
        </div>
        <table class="task-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Task</th>
              <th>Priority</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </section>
    </main>

    <script>
      const form = document.getElementById("taskForm");
      const titleInput = document.getElementById("taskTitle");
      const descriptionInput = document.getElementById("taskDescription");
      const priorityInput = document.getElementById("taskPriority");
      const taskTableBody = document.getElementById("taskTableBody");
      const taskCount = document.getElementById("taskCount");
      const completionBadge = document.getElementById("completionBadge");
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = themeToggle?.querySelector(".theme-icon");
      const THEME_STORAGE_KEY = "priority-planner-theme";
      const API_URL = "/api/tasks";

      let tasks = [];
      initializeTheme();
      loadTasks();

      function initializeTheme() {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const activeTheme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
        applyTheme(activeTheme);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#111827" : "#f5f2eb");
        if (themeToggle) {
          themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
          if (themeIcon) {
            themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
          }
        }
        localStorage.setItem(THEME_STORAGE_KEY, theme);
      }

      themeToggle?.addEventListener("click", () => {
        const nextTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
      });

      function normalizeTask(task) {
        return {
          id: task.id,
          title: task.title || "",
          description: task.description || "",
          priority: task.priority || "Medium",
          completed: Boolean(task.completed),
        };
      }

      async function loadTasks() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Unable to load tasks");
          const data = await response.json();
          tasks = Array.isArray(data) ? data.map(normalizeTask) : [];
          renderTasks();
        } catch (error) {
          console.error(error);
          tasks = [];
          renderTasks();
        }
      }

      function renderTasks() {
        taskTableBody.innerHTML = "";

        if (tasks.length === 0) {
          taskTableBody.innerHTML = `
            <tr>
              <td colspan="4" class="empty-state">No tasks yet. Add your first priority above.</td>
            </tr>
          `;
        } else {
          tasks.forEach((task) => {
            const row = document.createElement("tr");
            row.className = `task-row${task.completed ? " completed" : ""}`;
            row.innerHTML = `
              <td>
                <div class="task-title-cell">
                  <input class="checkbox" type="checkbox" ${task.completed ? "checked" : ""} data-id="${task.id}" />
                </div>
              </td>
              <td>
                <div class="task-title-cell">
                  <div>
                    <input class="title-input" value="${escapeHtml(task.title)}" data-id="${task.id}" data-field="title" />
                    <textarea class="description-input" data-id="${task.id}" data-field="description">${escapeHtml(task.description || "")}</textarea>
                  </div>
                </div>
              </td>
              <td>
                <select class="priority-select" data-id="${task.id}" data-field="priority">
                  <option value="High" ${task.priority === "High" ? "selected" : ""}>High</option>
                  <option value="Medium" ${task.priority === "Medium" ? "selected" : ""}>Medium</option>
                  <option value="Low" ${task.priority === "Low" ? "selected" : ""}>Low</option>
                </select>
              </td>
              <td>
                <button class="delete-btn" type="button" data-id="${task.id}">Remove</button>
              </td>
            `;
            taskTableBody.appendChild(row);
          });
        }

        updateSummary();
      }

      function updateSummary() {
        const completed = tasks.filter((task) => task.completed).length;
        const total = tasks.length;
        taskCount.textContent = `${total} ${total === 1 ? "task" : "tasks"}`;
        completionBadge.textContent = total === 0 ? "0% complete" : `${Math.round((completed / total) * 100)}% complete`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function refreshTasks() {
        await loadTasks();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        const description = descriptionInput.value.trim();
        const priority = priorityInput.value;

        if (!title) return;

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, description, priority, completed: false }),
          });

          if (!response.ok) throw new Error("Could not save task");
          await refreshTasks();
        } catch (error) {
          console.error(error);
        }

        form.reset();
        priorityInput.value = "Medium";
        titleInput.focus();
      });

      taskTableBody.addEventListener("change", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const id = target.dataset.id;
        const field = target.dataset.field;

        if (!id || !field) return;

        const currentTask = tasks.find((task) => task.id === id);
        if (!currentTask) return;

        try {
          const payload = {
            ...currentTask,
            [field]: field === "completed" ? target.checked : target.value,
          };
          const response = await fetch(`${API_URL}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!response.ok) throw new Error("Could not update task");
          await refreshTasks();
        } catch (error) {
          console.error(error);
        }
      });

      taskTableBody.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        if (target.classList.contains("delete-btn")) {
          const id = target.dataset.id;
          try {
            const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            if (!response.ok) throw new Error("Could not delete task");
            await refreshTasks();
          } catch (error) {
            console.error(error);
          }
        }
      });
    </script>
  </body>
</html>
